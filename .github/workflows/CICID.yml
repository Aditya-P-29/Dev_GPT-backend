# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [24.x]

    steps:

    - name : Backup .env
      run : |
        if [-f .env]; then mv .env /tmp/env_backup ; fi
    
    - uses: actions/checkout@v4

    - name : Restore .env
      run : |
        if [-f /tmp/env_backup]; then mv /tmp/env_backup .env; fi

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - run: npm ci
    - run: npm run build --if-present

    # 🔑 Sync code into your backend folder
    - name: Sync code to backend folder
      run: rsync -av --delete . ~/actions-runner/_work/devGPT-backend/devGPT-backend

    # 🔑 Restart PM2 with new code
    - name: Restart backend with PM2
      run: pm2 restart backend || pm2 start server.js --name backend

